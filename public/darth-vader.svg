<svg width="300" height="490" viewBox="0 0 300 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pixel art Darth Vader with red lightsaber</title>
<desc>Pixel art of Darth Vader holding a red lightsaber on transparent background</desc>

<g transform="translate(10, 20)">
<!-- Helmet top -->
<rect x="60" y="0" width="160" height="10" fill="#1a1a1a"/>
<rect x="50" y="10" width="180" height="10" fill="#1a1a1a"/>
<rect x="40" y="20" width="200" height="10" fill="#222"/>
<rect x="30" y="30" width="220" height="10" fill="#222"/>
<rect x="20" y="40" width="240" height="20" fill="#1a1a1a"/>
<!-- Helmet face -->
<rect x="20" y="60" width="240" height="80" fill="#111"/>
<!-- Eye lenses -->
<rect x="50" y="70" width="60" height="30" fill="#333"/>
<rect x="170" y="70" width="60" height="30" fill="#333"/>
<rect x="55" y="75" width="50" height="20" rx="2" fill="#0d0d0d"/>
<rect x="175" y="75" width="50" height="20" rx="2" fill="#0d0d0d"/>
<!-- Nose/mouth -->
<rect x="100" y="110" width="80" height="10" fill="#222"/>
<rect x="90" y="120" width="100" height="5" fill="#333"/>
<rect x="80" y="125" width="120" height="5" fill="#2a2a2a"/>
<rect x="70" y="130" width="140" height="10" fill="#1a1a1a"/>
<!-- Neck -->
<rect x="80" y="140" width="120" height="20" fill="#111"/>
<!-- Shoulder pads -->
<rect x="0" y="160" width="30" height="50" fill="#222"/>
<rect x="250" y="160" width="30" height="50" fill="#222"/>
<!-- Chest -->
<rect x="10" y="160" width="260" height="10" fill="#1a1a1a"/>
<rect x="10" y="170" width="260" height="120" fill="#1a1a1a"/>
<!-- Control panel -->
<rect x="80" y="185" width="120" height="60" fill="#0d0d0d"/>
<rect x="90" y="195" width="15" height="8" rx="1" fill="#cc2200"/>
<rect x="115" y="195" width="15" height="8" rx="1" fill="#888"/>
<rect x="140" y="195" width="15" height="8" rx="1" fill="#888"/>
<rect x="90" y="215" width="10" height="5" rx="1" fill="#555"/>
<rect x="110" y="215" width="10" height="5" rx="1" fill="#555"/>
<rect x="130" y="215" width="10" height="5" rx="1" fill="#555"/>
<rect x="150" y="215" width="10" height="5" rx="1" fill="#cc6600"/>
<!-- Arms -->
<rect x="0" y="210" width="30" height="80" fill="#1a1a1a"/>
<rect x="240" y="210" width="30" height="80" fill="#1a1a1a"/>
<!-- Saber hand -->
<rect x="240" y="285" width="35" height="15" fill="#222"/>
<!-- Lightsaber hilt -->
<rect x="268" y="250" width="12" height="50" fill="#888"/>
<rect x="266" y="255" width="16" height="5" fill="#aaa"/>
<rect x="266" y="275" width="16" height="3" fill="#666"/>
<!-- Lightsaber blade red -->
<rect x="270" y="30" width="8" height="225" fill="#ff1a1a" opacity="0.95"/>
<rect x="268" y="30" width="12" height="225" fill="#ff4444" opacity="0.3"/>
<rect x="266" y="30" width="16" height="225" fill="#ff0000" opacity="0.12"/>
<!-- Cape/lower body -->
<rect x="10" y="290" width="260" height="120" fill="#111"/>
<rect x="30" y="290" width="220" height="10" fill="#1a1a1a"/>
<!-- Legs -->
<rect x="50" y="380" width="80" height="60" fill="#1a1a1a"/>
<rect x="150" y="380" width="80" height="60" fill="#1a1a1a"/>
<!-- Boots -->
<rect x="45" y="430" width="90" height="20" fill="#0d0d0d"/>
<rect x="145" y="430" width="90" height="20" fill="#0d0d0d"/>
</g>
</svg>
