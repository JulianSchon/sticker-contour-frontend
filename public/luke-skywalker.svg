<svg width="300" height="490" viewBox="0 0 300 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pixel art Luke Skywalker with blue lightsaber</title>
<desc>Pixel art of Luke Skywalker holding a blue lightsaber on transparent background</desc>

<g transform="translate(10, 20)">
<!-- Hair -->
<rect x="70" y="0" width="140" height="10" fill="#c8a040"/>
<rect x="60" y="10" width="160" height="10" fill="#d4aa44"/>
<rect x="55" y="20" width="170" height="5" fill="#c8a040"/>
<!-- Face -->
<rect x="55" y="25" width="170" height="70" fill="#e8c080"/>
<!-- Eyes -->
<rect x="80" y="45" width="25" height="15" fill="white"/>
<rect x="175" y="45" width="25" height="15" fill="white"/>
<rect x="88" y="50" width="12" height="10" fill="#4466aa"/>
<rect x="183" y="50" width="12" height="10" fill="#4466aa"/>
<rect x="91" y="52" width="6" height="6" fill="#111"/>
<rect x="186" y="52" width="6" height="6" fill="#111"/>
<rect x="91" y="52" width="2" height="2" fill="white"/>
<rect x="186" y="52" width="2" height="2" fill="white"/>
<!-- Eyebrows -->
<rect x="80" y="40" width="28" height="4" fill="#a07830"/>
<rect x="172" y="40" width="28" height="4" fill="#a07830"/>
<!-- Nose -->
<rect x="130" y="65" width="10" height="5" fill="#d0a870"/>
<rect x="125" y="70" width="20" height="4" fill="#c89860"/>
<!-- Mouth -->
<rect x="110" y="82" width="60" height="6" fill="#c07060"/>
<rect x="115" y="88" width="50" height="4" fill="#e8c080"/>
<!-- Chin -->
<rect x="65" y="90" width="150" height="10" fill="#e0b878"/>
<!-- Neck -->
<rect x="105" y="100" width="70" height="20" fill="#e0b878"/>
<!-- Tunic -->
<rect x="20" y="120" width="240" height="10" fill="#e8e0d0"/>
<rect x="20" y="130" width="240" height="100" fill="#d8d0c0"/>
<!-- Folds -->
<rect x="130" y="135" width="6" height="90" fill="#c8c0b0"/>
<rect x="145" y="135" width="4" height="90" fill="#c8c0b0"/>
<!-- Shoulder robe -->
<rect x="10" y="120" width="25" height="60" fill="#b8b0a0"/>
<rect x="245" y="120" width="25" height="60" fill="#b8b0a0"/>
<!-- Belt -->
<rect x="20" y="228" width="240" height="14" fill="#8b6914"/>
<rect x="115" y="230" width="50" height="10" rx="1" fill="#6b4f10"/>
<rect x="125" y="232" width="30" height="6" fill="#c8a020"/>
<!-- Arms -->
<rect x="245" y="180" width="30" height="55" fill="#d8d0c0"/>
<rect x="243" y="232" width="34" height="16" fill="#222"/>
<rect x="5" y="180" width="28" height="55" fill="#d8d0c0"/>
<rect x="5" y="232" width="28" height="16" fill="#e0b878"/>
<!-- Lightsaber hilt -->
<rect x="265" y="196" width="12" height="42" fill="#999"/>
<rect x="263" y="200" width="16" height="5" fill="#bbb"/>
<rect x="263" y="218" width="16" height="3" fill="#666"/>
<rect x="264" y="228" width="14" height="4" fill="#777"/>
<!-- Lightsaber blade blue -->
<rect x="268" y="20" width="8" height="180" fill="#44aaff" opacity="0.95"/>
<rect x="266" y="20" width="12" height="180" fill="#66bbff" opacity="0.35"/>
<rect x="263" y="20" width="18" height="180" fill="#88ccff" opacity="0.12"/>
<rect x="269" y="15" width="6" height="8" fill="#aaddff" opacity="0.7"/>
<!-- Lower robe -->
<rect x="20" y="242" width="240" height="100" fill="#c8c0b0"/>
<rect x="120" y="242" width="8" height="100" fill="#b8b0a0"/>
<!-- Boots -->
<rect x="55" y="340" width="75" height="20" fill="#4a3010"/>
<rect x="150" y="340" width="75" height="20" fill="#4a3010"/>
<rect x="50" y="355" width="85" height="15" fill="#3a2008"/>
<rect x="145" y="355" width="85" height="15" fill="#3a2008"/>
</g>
</svg>
